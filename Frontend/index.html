    <script>
      (function() {
        var stored = localStorage.getItem('sd_theme');
        var theme = (stored === 'green' || stored === 'dark') ? 'green' : 'cream';
        document.documentElement.setAttribute('data-theme', theme);
        var storedLang = localStorage.getItem('sd_lang') || 'tr';
        document.documentElement.setAttribute('lang', storedLang);
      })();
    </script>
  </head>
  <body class="antialiased selection:bg-emerald-500/30 selection:text-emerald-300">
